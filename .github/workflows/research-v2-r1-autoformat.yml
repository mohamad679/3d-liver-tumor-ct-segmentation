name: Research V2 R1 temporary autoformat

on:
  push:
    branches:
      - research-v2/r1-pixel-metric-audit

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: research-v2/r1-pixel-metric-audit
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install locked environment
        run: uv sync --frozen --python 3.11 --all-groups
      - name: Apply exact reported lint repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path("src/protoem_ct/research_v2/r1_audit.py")
          text = audit.read_text()
          replacements = {
              '    """Return exactly the 91 train + 20 validation cases without authorizing internal-test arrays."""\n': (
                  '    """Return exactly 91 train + 20 validation cases.\n\n'
                  '    Internal-test arrays are never authorized.\n'
                  '    """\n'
              ),
              '    assignments_by_id = {assignment.anonymous_case_id: assignment for assignment in split.assignments}\n': (
                  '    assignments_by_id = {\n'
                  '        assignment.anonymous_case_id: assignment for assignment in split.assignments\n'
                  '    }\n'
              ),
              '            f"raw label array contains values outside {R1_ALLOWED_RAW_LABEL_VALUES}: {sorted(unexpected)}"\n': (
                  '            "raw label array contains values outside "\n'
                  '            f"{R1_ALLOWED_RAW_LABEL_VALUES}: {sorted(unexpected)}"\n'
              ),
              '        raise R1MetricInputError("fixture probability values must lie in [0, 1]; logits are rejected")\n': (
                  '        raise R1MetricInputError(\n'
                  '            "fixture probability values must lie in [0, 1]; logits are rejected"\n'
                  '        )\n'
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected r1_audit.py text not found: {old!r}")
              text = text.replace(old, new, 1)
          audit.write_text(text)

          runner = Path("scripts/research_v2/run_r1_mac_lexar_audit.py")
          text = runner.read_text()
          old_nested = '''    if all(np.isfinite(image_spacing)) and all(np.isfinite(label_spacing)):\n        if not np.allclose(image_spacing, label_spacing, rtol=0.0, atol=1e-6):\n            mismatch("image_label_spacing_mismatch")\n'''
          new_nested = '''    if (\n        all(np.isfinite(image_spacing))\n        and all(np.isfinite(label_spacing))\n        and not np.allclose(image_spacing, label_spacing, rtol=0.0, atol=1e-6)\n    ):\n        mismatch("image_label_spacing_mismatch")\n'''
          if old_nested not in text:
              raise SystemExit("expected nested spacing check not found")
          text = text.replace(old_nested, new_nested, 1)
          old_sig = '''def _roundtrip_trace(\n    *, image: np.ndarray, tumor: np.ndarray, native_affine: np.ndarray, target_spacing: tuple[float, ...]\n) -> tuple[dict[str, Any], np.ndarray]:\n'''
          new_sig = '''def _roundtrip_trace(\n    *,\n    image: np.ndarray,\n    tumor: np.ndarray,\n    native_affine: np.ndarray,\n    target_spacing: tuple[float, ...],\n) -> tuple[dict[str, Any], np.ndarray]:\n'''
          if old_sig not in text:
              raise SystemExit("expected roundtrip signature not found")
          text = text.replace(old_sig, new_sig, 1)
          runner.write_text(text)
          PY
      - name: Apply Ruff formatting and verify lint
        run: |
          uv run ruff format src/protoem_ct/research_v2/r1_audit.py tests/unit/test_research_v2_r1_audit.py scripts/research_v2/run_r1_mac_lexar_audit.py scripts/research_v2/review_r1_overlays.py
          uv run ruff check src/protoem_ct/research_v2/r1_audit.py tests/unit/test_research_v2_r1_audit.py scripts/research_v2/run_r1_mac_lexar_audit.py scripts/research_v2/review_r1_overlays.py
      - name: Commit mechanical formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/protoem_ct/research_v2/r1_audit.py tests/unit/test_research_v2_r1_audit.py scripts/research_v2/run_r1_mac_lexar_audit.py scripts/research_v2/review_r1_overlays.py
          git commit -m "style(research-v2): format R1 audit code"
          git push origin HEAD:research-v2/r1-pixel-metric-audit
