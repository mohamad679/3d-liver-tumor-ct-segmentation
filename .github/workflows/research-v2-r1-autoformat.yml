name: Research V2 R1 temporary autoformat

on:
  push:
    branches:
      - research-v2/r1-pixel-metric-audit

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: research-v2/r1-pixel-metric-audit
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install locked environment
        run: uv sync --frozen --python 3.11 --all-groups
      - name: Apply Ruff formatting and verify lint
        run: |
          uv run ruff format scripts/research_v2/run_r1_mac_lexar_audit.py scripts/research_v2/review_r1_overlays.py
          uv run ruff check scripts/research_v2/run_r1_mac_lexar_audit.py scripts/research_v2/review_r1_overlays.py
      - name: Commit mechanical formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/research_v2/run_r1_mac_lexar_audit.py scripts/research_v2/review_r1_overlays.py
          git commit -m "style(research-v2): format R1 audit scripts"
          git push origin HEAD:research-v2/r1-pixel-metric-audit
